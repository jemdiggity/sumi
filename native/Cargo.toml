[package]
name = "sumi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Standalone native scheduling preview for Sumi"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
