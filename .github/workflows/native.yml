name: Native Sumi preview
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy && rustup default 1.93.1
      - name: Build and lint
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --locked --manifest-path native/Cargo.toml -- -D warnings
          native/build.sh '${{ matrix.target }}'
      - name: Shared CLI and cross-implementation checks
        env:
          SUMI_NATIVE_BIN: ${{ github.workspace }}/dist/${{ matrix.target }}/sumi
        run: python3 -m unittest discover -s tests -v
      - name: Inspect native dependencies
        run: |
          if [ "$(uname)" = Darwin ]; then
            otool -L 'dist/${{ matrix.target }}/sumi'
          else
            ldd 'dist/${{ matrix.target }}/sumi'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sumi-${{ matrix.target }}
          path: dist/${{ matrix.target }}/sumi
